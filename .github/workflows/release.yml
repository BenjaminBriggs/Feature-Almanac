name: Release

# Push a tag like v0.2.0 to create the GitHub release with the packed feature-almanac tarball and point
# the Homebrew formula in BenjaminBriggs/homebrew-tap at it. With the repository variable NPM_PUBLISH
# set to "true", it also publishes to npm. See docs/development.md#releasing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag matches packages/cli
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match feature-almanac $version in packages/cli/package.json"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TARBALL=$RUNNER_TEMP/feature-almanac-$version.tgz" >> "$GITHUB_ENV"

      - run: npm run check

      - name: Pack and smoke test the tarball
        run: |
          npm pack -w packages/cli --pack-destination "$RUNNER_TEMP"
          node packages/cli/scripts/smoke.mjs "$TARBALL"

      # 0.x versions are marked as pre-releases. A retry leaves an existing release and its tarball alone,
      # so the formula's checksum keeps matching.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already released"
            exit 0
          fi
          flags=(--verify-tag --generate-notes)
          if [ "${VERSION%%.*}" = 0 ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$TARBALL" "${flags[@]}"

      - name: Update the Homebrew formula
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          released="$RUNNER_TEMP/released.tgz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$released" \
            "https://github.com/BenjaminBriggs/Feature-Almanac/releases/download/$GITHUB_REF_NAME/feature-almanac-$VERSION.tgz"
          sha256=$(sha256sum "$released" | cut -d' ' -f1)

          # A deploy key that can write to the tap and nothing else.
          key="$RUNNER_TEMP/homebrew-tap-key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes"

          tap="$RUNNER_TEMP/homebrew-tap"
          git clone git@github.com:BenjaminBriggs/homebrew-tap.git "$tap"
          mkdir -p "$tap/Formula"
          node packages/cli/scripts/homebrew-formula.mjs "$VERSION" "$sha256" > "$tap/Formula/almanac.rb"

          cd "$tap"
          git add Formula/almanac.rb
          if git diff --cached --quiet; then
            echo "Formula/almanac.rb is already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "almanac $VERSION"
          git push

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        if: vars.NPM_PUBLISH == 'true'
        run: npm install --global npm@^11.5.1

      # Skipped when the version is already on npm, as when the first release was published by hand
      # or this run is a retry.
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        run: |
          if curl -fsS -o /dev/null "https://registry.npmjs.org/feature-almanac/$VERSION"; then
            echo "feature-almanac@$VERSION is already on npm"
          else
            npm publish -w packages/cli
          fi
