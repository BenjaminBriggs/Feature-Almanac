# yaml-language-server: $schema=https://feature-almanac.dev/schema/v1/feature.json
id: "5.3"
name: Relinking renamed files
description: Repoint sources at files a change renamed or moved.
owner: ben
status: shipped
platforms: [cli]
next_behaviour: 11

behaviours:
  - id: "5.3.1"
    name: Following a renamed file
    description: |
      Repoints entries at a renamed file's new path, keeping the symbol.
      Given behaviour PL-1.1.2 citing `src/Editor/Save.swift#save`, and a branch that renamed that file to src/Store/Save.swift
      When the user runs `almanac relink main...HEAD`
      Then the entry becomes `src/Store/Save.swift#save`
      And it prints "main...HEAD: 1 file renamed or moved under the code path.", then PL-1.1.2 and the old entry with "→ src/Store/Save.swift#save" below it, then "Repointed 1 entry on 1 feature or behaviour, in 1 file."
      And an entry whose new path is already cited is dropped rather than listed twice
      And the change is named as for `almanac affected`: a commit, a range, `--base <ref>`, nothing for uncommitted work, or `--files`
    source: [packages/cli/src/commands/relink.ts#registerRelinkCommand, packages/cli/src/commands/relink.ts#report, packages/core/src/relink.ts#planRelink, packages/core/src/relink.ts#relinkEntry]

  - id: "5.3.2"
    name: Feature code and variants
    description: |
      Repoints features' `code` entries and variants' sources too.
      Given a renamed file that feature 1.1's `code` and the Android variant of 1.1.4 both cite
      When the user runs `almanac relink main...HEAD`
      Then both entries point at the new path, and the report lists them against PL-1.1 as "code" and PL-1.1.4@android as "source"
    source: [packages/core/src/relink.ts#planRelink]

  - id: "5.3.3"
    name: A folder that moved whole
    description: |
      Repoints a folder entry when everything in it moved to one new folder.
      Given behaviour 1.1.3 citing `src/Editor/`, and a change that moved every file in src/Editor/ to src/Text/
      When the user runs `almanac relink main...HEAD`
      Then the entry becomes `src/Text/`
      But if any file is still in src/Editor/, or its files went to different folders, the entry is left for the user
    source: [packages/core/src/relink.ts#relinkEntry, packages/cli/src/commands/relink.ts#hasFiles]

  - id: "5.3.4"
    name: Entries left for the user
    description: |
      Lists the entries it can't safely repoint, and leaves them as they are.
      Given entries citing a glob over renamed files, a deleted file, and a folder only some of whose files moved
      When the user runs `almanac relink main...HEAD`
      Then they are listed under "Left for you (3):", each with its reason: "a glob over renamed files; check it by hand", "the file was deleted" or "only some of its files moved"
      And a folder whose files went to different places gets "its files moved to different places"
    source: [packages/core/src/relink.ts#relinkEntry, packages/cli/src/commands/relink.ts#report]

  - id: "5.3.5"
    name: No changelog entry
    description: |
      Repoints without touching any changelog or review, since a moved file changes nothing a user sees.
      Given renamed files that behaviours cite
      When the user runs `almanac relink main...HEAD`
      Then only `source` and `code` lists change
      And no changelog entry is written
      And approved reviews stay current, because sources aren't part of what a reviewer approves
    source: [packages/cli/src/commands/relink.ts#registerRelinkCommand, packages/core/src/review.ts#reviewHash]

  - id: "5.3.6"
    name: Nothing to repoint
    description: |
      Says so when no entry cites a moved file.
      Given a change in which no cited file was renamed or moved
      When the user runs `almanac relink main...HEAD`
      Then it prints "No source or code entry points at a moved file." and writes nothing
      And a plain list of paths, such as from `gh pr diff --name-only`, holds no renames, so `--files` with one never repoints anything
    source: [packages/cli/src/commands/relink.ts#report, packages/core/src/affected.ts#parseChangedFiles]

  - id: "5.3.7"
    name: Dry run
    description: |
      Shows the repointing as a diff without writing anything.
      Given renamed files that behaviours cite
      When the user runs `almanac --dry-run relink main...HEAD`
      Then a unified diff of the almanac files is printed and nothing is written
      But the "Left for you" list isn't shown when there is something to repoint
    source: [packages/cli/src/commands/relink.ts#registerRelinkCommand, packages/core/src/changes.ts#renderDiff]

  - id: "5.3.8"
    name: Removed entries left alone
    description: |
      Leaves removed behaviours, variants and features pointing where they did.
      Given a behaviour removed on every platform that cites a renamed file
      When the user runs `almanac relink main...HEAD`
      Then its `source` is left as it was, since it records the past
    source: [packages/core/src/relink.ts#planRelink]

  - id: "5.3.9"
    name: Refused when it would break lint
    description: |
      Writes nothing when the repointing would add lint errors.
      Given renamed files whose repointing would introduce a lint error
      When the user runs `almanac relink main...HEAD`
      Then it stops with exit code 1 and "error: Repointing would introduce lint errors; nothing was written", with the errors listed above it
      And no file changes
    source: [packages/cli/src/commands/relink.ts#registerRelinkCommand]

  - id: "5.3.10"
    name: JSON output
    description: |
      Gives the repointing as data for agents and scripts.
      Given any change
      When the user runs `almanac --json relink main...HEAD`
      Then `data` holds `change`, `renamed`, `repointed` (each with `ref`, `field`, `from` and `to`), `unresolved` (each with `ref`, `field`, `entry` and `reason`), `files` and `dryRun`
    source: [packages/cli/src/commands/relink.ts#registerRelinkCommand]

